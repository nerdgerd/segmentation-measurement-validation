name: Scientific checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q
      - run: python tools/reproduce.py verify
      - run: python tools/reproduce.py summary
      - run: python tools/reproduce.py run measurement-differences --run-id ci-q2
      - run: python tools/reproduce.py figures
